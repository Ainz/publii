<!-- 0. Core (window.TT; must stay first) -->
<script>
/* Shared core, window.TT: categories, site root, fetch cache, card and post data, tiles, heading index. */
(function () {
  if (!window.fetch || !window.DOMParser || !window.URL) return;
  var CACHE = 'tt3:', memo = {};
  var TT = {
    cats: { security: 'Security', compliance: 'Compliance', internet: 'Internet', itsm: 'ITSM',
            career: 'Career', tech: 'Tech', gaming: 'Gaming' },
    home: function () {
      var logo = document.querySelector('.topbar .logo, .footer__logo');
      return new URL(logo ? logo.getAttribute('href') : '/', location.href).href;
    },
    get: function (url) {
      if (!memo[url]) memo[url] = fetch(url, { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; });
      return memo[url];
    },
    doc: function (html) { return new DOMParser().parseFromString(html, 'text/html'); },
    el: function (tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      return e;
    },
    trimWords: function (t, n) {
      var w = t.split(' ');
      return w.length > n ? w.slice(0, n).join(' ').replace(/[,;:.\-–—]+$/, '') + '…' : t;
    },
    /* category slug from an element carrying u-tag--<slug>, if that tag is a category */
    catOf: function (node) {
      var m = node && (node.getAttribute('class') || '').match(/u-tag--([a-z0-9-]+)/);
      return m && TT.cats[m[1]] ? m[1] : null;
    },
    postInfo: function (url) {
      try { var hit = JSON.parse(sessionStorage.getItem(CACHE + url)); if (hit) return Promise.resolve(hit); } catch (e) {}
      return TT.get(url).then(function (html) {
        if (!html) return { c: null, t: '' };
        var d = TT.doc(html), text = '';
        var ps = d.querySelectorAll('.content__entry p');
        for (var j = 0; j < ps.length; j++) {
          if (ps[j].closest('.post__toc, figure, blockquote, table, .cv-toc')) continue;
          var t = ps[j].textContent.replace(/\s+/g, ' ').trim();
          if (t.length > 40) { text = t; break; }
        }
        var info = { c: TT.catOf(d.querySelector('.content__header .u-tag')), t: text };
        try { sessionStorage.setItem(CACHE + url, JSON.stringify(info)); } catch (e) {}
        return info;
      });
    },
    cardInfo: function (card, base) {
      var a = card.querySelector('.c-card__title a'), t = card.querySelector('time'), im = card.querySelector('img');
      if (!a) return null;
      var src = im ? (im.getAttribute('srcset') || '').split(',')[0].trim().split(' ')[0] || im.getAttribute('src') : '';
      return { url: new URL(a.getAttribute('href'), base).href, title: a.textContent.trim(),
               iso: t ? t.getAttribute('datetime') || '' : null, date: t ? t.textContent.trim() : '',
               cat: TT.catOf(card.querySelector('.c-card__tag')), img: src ? new URL(src, base).href : '' };
    },
    /* Same markup as a post's Previous/Next (Custom CSS section 50, .tt-pagehost). */
    tile: function (dir, href, n, per, count, cat, img) {
      var wrap = TT.el('div', 'content__nav__' + dir);
      var a = TT.el('a', 'content__nav__link' + (cat ? ' tt-fc-' + cat : ''));
      a.href = href;
      a.rel = dir;
      var txt = TT.el('div', 'u-small', dir === 'prev' ? 'Previous page' : 'Next page');
      var first = (n - 1) * per + 1;
      txt.appendChild(TT.el('h5', null, 'Page ' + n + ' · ' + (count === 1 ? 'post ' + first : 'posts ' + first + '–' + (first + count - 1))));
      var pic = null;
      if (img) { pic = TT.el('img'); pic.src = img; pic.alt = ''; }   /* no loading attr: the theme hides img[loading] until it gets .is-loaded */
      if (dir === 'prev') { if (pic) a.appendChild(pic); a.appendChild(txt); }
      else { a.appendChild(txt); if (pic) a.appendChild(pic); }
      wrap.appendChild(a);
      return wrap;
    },
    /* toc(root, [section, entry], skip): two-level heading index; returns {el, count, mark, reveal}. */
    toc: function (root, levels, skip) {
      levels = levels || ['H3', 'H4'];
      var used = {}, all = [], secs = [];
      Array.prototype.forEach.call(document.querySelectorAll('[id]'), function (e) { used[e.id] = 1; });
      function slug(t) { return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
      function text(h) { return h.textContent.replace(/\s+/g, ' ').trim(); }
      function idFor(h) {
        if (h.id) return h.id;
        var s = slug(text(h)) || 'section', n = s, i = 2;
        while (used[n]) n = s + '-' + i++;
        used[n] = 1; h.id = n; return n;
      }
      Array.prototype.forEach.call(root.querySelectorAll(levels.join(',')), function (h) {
        if (skip && h.closest(skip)) return;
        if (h.tagName === levels[0]) secs.push({ h: h, kids: [] });
        else if (secs.length) secs[secs.length - 1].kids.push(h);
      });
      var ol = TT.el('ol', 'tt-toc');
      function link(h) { var a = TT.el('a', null, text(h)); a.href = '#' + idFor(h); a.setAttribute('data-target', h.id); all.push(h); return a; }
      function open(li, on) {
        Array.prototype.forEach.call(ol.children, function (x) {
          var b = x.querySelector('.tt-toc__btn'), o = x === li ? on : false;
          x.classList.toggle('is-open', o);
          if (b) b.setAttribute('aria-expanded', String(o));
        });
      }
      secs.forEach(function (s) {
        var li = TT.el('li'), row = TT.el('div', 'tt-toc__row'), a = link(s.h);
        row.appendChild(a);
        li.appendChild(row);
        if (s.kids.length) {
          a.appendChild(TT.el('span', 'tt-toc__n', '· ' + s.kids.length));
          var b = TT.el('button', 'tt-toc__btn');
          b.type = 'button';
          b.setAttribute('aria-expanded', 'false');
          b.setAttribute('aria-label', text(s.h));
          row.appendChild(b);
          var sub = TT.el('ol', 'tt-toc__sub');
          s.kids.forEach(function (k) { var l2 = TT.el('li'); l2.appendChild(link(k)); sub.appendChild(l2); });
          li.appendChild(sub);
          b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); open(li, !li.classList.contains('is-open')); });
        }
        ol.appendChild(li);
      });
      function mark() {
        var cur = null;
        for (var i = 0; i < all.length; i++) { if (all[i].getBoundingClientRect().top < window.innerHeight * 0.2) cur = all[i]; else break; }
        Array.prototype.forEach.call(ol.querySelectorAll('a.is-current'), function (x) { x.classList.remove('is-current'); });
        if (!cur) return null;
        var a = ol.querySelector('a[data-target="' + cur.id + '"]');
        if (a) a.classList.add('is-current');
        return a;
      }
      function reveal() {
        var a = mark(), li = a && a.closest('.tt-toc > li');
        if (li && li.querySelector('.tt-toc__sub')) open(li, true);
        return a;
      }
      return { el: ol, count: secs.length, mark: mark, reveal: reveal };
    }
  };
  window.TT = TT;
})();
</script>
<!-- 1. Cards -->
<script>
/* Card excerpts and category colours: homepage and tag cards, post Previous/Next tiles. */
(function () {
  var TT = window.TT;
  if (!TT) return;
  var WORDS = 12;                       /* excerpt length in words */

  /* Drop whole words until the excerpt fits its clamped lines, so it never ends mid-word. */
  function fit(p) {
    var w = p.getAttribute('data-full').replace(/…$/, '').split(' ');
    p.textContent = p.getAttribute('data-full');
    while (p.scrollHeight > p.clientHeight + 1 && w.length > 3) {
      w.pop();
      p.textContent = w.join(' ').replace(/[,;:.\-–—]+$/, '') + '…';
    }
  }

  /* Cards: colour + excerpt. */
  Array.prototype.forEach.call(document.querySelectorAll('.c-card'), function (card) {
    var a = card.querySelector('.c-card__title a');
    if (!a || !a.href) return;
    TT.postInfo(a.href).then(function (d) {
      if (d.c) card.classList.add('tt-fc-' + d.c);
      if (d.t && !card.querySelector('.tt-excerpt')) {
        var title = card.querySelector('.c-card__title');
        if (!title) return;
        var p = TT.el('p', 'tt-excerpt');
        p.setAttribute('data-full', TT.trimWords(d.t, WORDS));
        title.insertAdjacentElement('afterend', p);
        fit(p);
      }
    });
  });

  /* Post pages: Previous/Next tiles take the linked post's category colour. */
  Array.prototype.forEach.call(document.querySelectorAll('.content__nav__link'), function (link) {
    if (!link.href) return;
    TT.postInfo(link.href).then(function (d) { if (d.c) link.classList.add('tt-fc-' + d.c); });
  });

  var t;
  window.addEventListener('resize', function () {
    clearTimeout(t);
    t = setTimeout(function () { Array.prototype.forEach.call(document.querySelectorAll('.tt-excerpt[data-full]'), fit); }, 200);
  });
})();
</script>

<!-- 3. Featured image -->
<script>
/* Featured image moved (not copied) into the text after the opening lines, Posts and Pages. */
(function () {
  'use strict';
  const CONFIG = {
    onlyOn:  'body.post-template, body.page-template',
    post:    '.main.post > .content',
    page:    '.main.page > .content',
    minChars: 160,   // a "few lines": the intro is at least this long (else take the next paragraph too)
    minPara: 60,     // shorter paragraphs before the intro are notes, not the intro (e.g. "Repost from LinkedIn")
  };
  function run() {
    if (!document.querySelector(CONFIG.onlyOn)) return;
    const isPage = document.body.matches('body.page-template');
    const content = document.querySelector(isPage ? CONFIG.page : CONFIG.post);
    const fig = content && content.querySelector(':scope > .content__featured-image');
    const entry = content && content.querySelector(':scope > .content__entry');
    if (!fig || !entry) return;
    // Page colour markers can wrap the whole reading text; keep the figure inside that wrapper.
    const scope = isPage && entry.children.length === 1 && entry.firstElementChild.matches('[class*="fc-"]')
      ? entry.firstElementChild : entry;
    // Skip the ToC, leading headings and short notes ("Repost from LinkedIn", right/centre-aligned lines).
    // The first real paragraph (>= minPara chars) starts the intro; keep adding paragraphs until the intro
    // reaches minChars, and stop early at a heading, list, table, code block… (the image goes before it).
    const isNote = el => el.matches('p.align-right, p.align-center, p.msg') || el.textContent.trim().length < CONFIG.minPara;
    let anchor = null, chars = 0;
    for (const el of scope.children) {
      const para = el.matches('p, blockquote');
      if (!anchor) {
        if (para && !isNote(el)) { anchor = el; chars = el.textContent.trim().length; if (chars >= CONFIG.minChars) break; }
        continue;                                   // ToC, headings, notes, rules… before the intro: skip
      }
      if (!para) break;
      anchor = el; chars += el.textContent.trim().length;
      if (chars >= CONFIG.minChars) break;
    }
    // A Page with only short or structured opening content must still lose the above-title banner.
    if (!anchor && isPage) anchor = scope.querySelector(':scope > p, :scope > blockquote') || scope.firstElementChild;
    if (anchor) anchor.after(fig);
    else if (isPage) scope.append(fig);
    else return; // preserve the Post short-note behavior
    document.body.classList.add('has-cinline');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
})();
</script>

<!-- 5. Archive Page -->
<script>
/* Archive Page (needs div.tt-allposts): all posts by year from the listing, PER per page (0 = all). */
(function () {
  var TT = window.TT;
  if (!TT) return;
  var box = document.querySelector('.content__entry .tt-allposts');
  if (!box) return;
  var WORDS = 30, MAXPAGES = 50, PER = 12;

  /* Walk the listing pages: one TT.cardInfo per card (cards without a date are skipped). */
  function crawl(url, seen, list, n) {
    if (!url || n >= MAXPAGES) return Promise.resolve(list);
    return TT.get(url).then(function (h) {
      if (!h) return list;
      var d = TT.doc(h);
      Array.prototype.forEach.call(d.querySelectorAll('.c-card'), function (c) {
        var p = TT.cardInfo(c, url);
        if (!p || p.iso === null || seen[p.url]) return;
        seen[p.url] = 1;
        list.push(p);
      });
      var next = d.querySelector('link[rel="next"]');
      return crawl(next ? new URL(next.getAttribute('href'), url).href : null, seen, list, n + 1);
    });
  }

  function pageUrl(n) { var u = new URL(location.href); if (n > 1) u.searchParams.set('page', n); else u.searchParams.delete('page'); return u.href; }
  function tile(dir, n, posts) {
    var first = posts[(n - 1) * PER], count = Math.min(PER, posts.length - (n - 1) * PER);
    return TT.tile(dir, pageUrl(n), n, PER, count, first.cat, first.img);
  }
  function pager(posts, page, pages) {
    var host = TT.el('div', 'tt-pagehost');
    var nav = TT.el('nav', 'content__nav box');
    nav.setAttribute('aria-label', 'Archive pages');
    if (page > 1) nav.appendChild(tile('prev', page - 1, posts));
    if (page < pages) nav.appendChild(tile('next', page + 1, posts));
    host.appendChild(nav);
    return host;
  }

  crawl(TT.home(), {}, [], 0).then(function (posts) {
    if (!posts.length) return;
    posts.sort(function (a, b) { return a.iso < b.iso ? 1 : a.iso > b.iso ? -1 : 0; });
    var total = posts.length, pages = PER ? Math.ceil(total / PER) : 1;
    var page = parseInt(new URLSearchParams(location.search).get('page'), 10) || 1;
    if (page < 1 || page > pages) page = 1;
    var slice = PER ? posts.slice((page - 1) * PER, page * PER) : posts;
    var wrap = TT.el('div', 'tt-ap'), year = null, list = null;
    slice.forEach(function (p) {
      var y = p.iso.slice(0, 4) || '—';
      if (y !== year) {
        year = y;
        var sec = TT.el('section', 'tt-ap__year');
        sec.appendChild(TT.el('h2', null, y));
        list = TT.el('ol', 'tt-ap__list');
        sec.appendChild(list);
        wrap.appendChild(sec);
      }
      var li = TT.el('li', 'tt-ap__item' + (p.cat ? ' tt-fc-' + p.cat : ''));
      var t = TT.el('time', 'tt-ap__date', p.date);
      t.setAttribute('datetime', p.iso);
      var body = TT.el('div', 'tt-ap__body');
      var a = TT.el('a', 'tt-ap__title', p.title);
      a.href = p.url;
      body.appendChild(a);
      if (p.cat) body.appendChild(TT.el('span', 'tt-ap__cat', TT.cats[p.cat]));
      li.appendChild(t);
      li.appendChild(body);
      list.appendChild(li);
      TT.postInfo(p.url).then(function (d) {
        if (!d.t) return;
        body.appendChild(TT.el('p', 'tt-ap__excerpt', TT.trimWords(d.t, WORDS)));
      });
    });
    var count = TT.el('p', 'tt-ap__count', total + ' posts' + (pages > 1 ? ' · page ' + page + ' of ' + pages : ''));
    box.innerHTML = '';
    box.appendChild(count);
    box.appendChild(wrap);
    if (pages > 1) {
      var art = box.closest('.content');
      var pg = pager(posts, page, pages);
      if (art && art.parentNode) art.parentNode.insertBefore(pg, art.nextSibling); else box.appendChild(pg);
    }
    box.classList.add('is-built');
  }).catch(function () {});
})();
</script>

<script>
/* Menus: Footer menu items join the top bar (li.nav-util); the footer gets one bar with both groups.
   Runs before the theme's menu script, so the mobile menu includes them. */
(function () {
  var main = document.querySelector('.topbar .navbar__menu');
  var subNav = document.querySelector('.footer > nav');
  var sub = subNav && subNav.querySelector('.footer__nav');
  if (!main) return;

  function here(a) {
    if (!a || !a.href) return false;
    try {
      var u = new URL(a.href, location.href), l = new URL(location.href);
      return u.origin === l.origin && u.pathname.replace(/index\.html$/, '') === l.pathname.replace(/index\.html$/, '');
    } catch (e) { return false; }
  }
  function item(link, cls) {
    var li = document.createElement('li');
    if (cls) li.className = cls;
    var c = link.cloneNode(true);
    c.removeAttribute('aria-haspopup');
    li.appendChild(c);
    if (here(link)) li.classList.add('active');
    return li;
  }

  /* 1. top bar: utility group */
  var util = [];
  if (sub) {
    Array.prototype.forEach.call(sub.children, function (li) {
      var a = li.querySelector('a, span');
      if (!a) return;
      util.push(a);
      main.appendChild(item(a, 'nav-util'));
    });
  }

  /* 1b. current page: Publii doesn't flag the front-page link, so mark every top-level match here */
  Array.prototype.forEach.call(main.children, function (li) {
    if (here(li.querySelector(':scope > a'))) li.classList.add('active');
  });
  function current(root) {
    Array.prototype.forEach.call(root.querySelectorAll('li.active > a'), function (a) { a.setAttribute('aria-current', 'page'); });
  }
  current(main);

  /* 2. footer bar: both groups, top level only */
  var footer = document.querySelector('.footer');
  if (!footer) return;
  var bar = document.createElement('nav');
  bar.className = 'tt-footnav';
  bar.setAttribute('aria-label', 'Site');
  var left = document.createElement('ul'), right = document.createElement('ul');
  left.className = 'tt-footnav__main';
  right.className = 'tt-footnav__util';
  Array.prototype.forEach.call(main.children, function (li) {
    if (li.classList.contains('nav-util')) return;
    var a = li.querySelector(':scope > a, :scope > span');
    if (!a || a.tagName.toLowerCase() === 'span') return;
    var n = item(a);
    if (li.classList.contains('active')) n.classList.add('active');
    if (li.classList.contains('active-parent')) n.classList.add('active-parent');
    left.appendChild(n);
  });
  util.forEach(function (a) { right.appendChild(item(a)); });
  bar.appendChild(left);
  if (right.children.length) bar.appendChild(right);
  current(bar);
  if (subNav) subNav.parentNode.replaceChild(bar, subNav);
  else footer.insertBefore(bar, footer.firstChild);
})();
</script>
<!-- 7. Listing pagination -->
<script>
/* Listing pagination as tiles: left "Previous page" = newer posts, right "Next page" = older. */
(function () {
  var TT = window.TT;
  if (!TT) return;
  var pag = document.querySelector('.pagination');
  if (!pag) return;
  var links = pag.querySelectorAll('a.pagination__item');
  if (!links.length) return;

  function pageNo(path) { var m = path.match(/\/page\/(\d+)\/?(?:index\.html)?$/); return m ? +m[1] : 1; }
  var cur = pageNo(location.pathname);
  var here = document.querySelectorAll('.c-card').length;

  /* Number of posts on a listing page, and its first card's thumbnail and category. */
  function info(href) {
    return TT.get(href).then(function (h) {
      if (!h) return null;
      var cards = TT.doc(h).querySelectorAll('.c-card');
      if (!cards.length) return null;
      var c = TT.cardInfo(cards[0], href);
      return { n: cards.length, img: c ? c.img : '', cat: c ? c.cat : null };
    });
  }

  var targets = Array.prototype.map.call(links, function (a) {
    var href = a.href;
    return info(href).then(function (i) { return i ? { href: href, n: pageNo(new URL(href).pathname), i: i } : null; });
  });
  Promise.all(targets).then(function (t) {
    t = t.filter(Boolean);
    if (!t.length) return;
    /* posts per page: every page but the last is full, so this page (page 1) or the newer neighbour tells us */
    var newer = t.filter(function (x) { return x.n < cur; })[0];
    var per = cur === 1 ? here : (newer ? newer.i.n : here);
    t.sort(function (a, b) { return a.n - b.n; });
    var host = TT.el('div', 'tt-pagehost ' + pag.className.replace(/\bpagination\b/, '').trim());
    var nav = TT.el('nav', 'content__nav box');
    nav.setAttribute('aria-label', 'Pages');
    t.forEach(function (x) { nav.appendChild(TT.tile(x.n < cur ? 'prev' : 'next', x.href, x.n, per, x.i.n, x.i.cat, x.i.img)); });
    host.appendChild(nav);
    pag.parentNode.insertBefore(host, pag);
    pag.classList.add('tt-replaced');
  });
})();
</script>

<script>
/* Archive and tag pages: category bar; "All" = the Archive Page, found by its address. */
(function () {
  'use strict';
  var TT = window.TT;
  if (!TT) return;

  var tagPage = document.querySelector('main.page--tag');
  var archiveList = document.querySelector('main.page .content__entry .tt-allposts');
  if (!tagPage && !archiveList) return;

  var home = TT.home();
  var tagsIndex = new URL('tags/', home);
  var archiveLink = document.querySelector('nav a[href$="archive.html"]');
  var archiveHref = archiveLink ? archiveLink.href : new URL('archive.html', home).href;

  TT.get(tagsIndex.href).then(function (html) {
    if (!html) return;
    var doc = TT.doc(html);
    var bySlug = {};
    Array.prototype.forEach.call(doc.querySelectorAll('.page--tags .c-card__title a[href]'), function (a) {
      var url = new URL(a.getAttribute('href'), tagsIndex.href);
      if (url.origin !== location.origin) return;
      var slug = url.pathname.replace(/\/$/, '').split('/').pop();
      bySlug[slug] = url.href;
    });
    var slugs = Object.keys(TT.cats);
    if (!slugs.some(function (s) { return bySlug[s]; })) return;   /* skip a missing tag, not the whole bar */

    var nav = TT.el('nav', 'tt-category-nav');
    nav.setAttribute('aria-label', 'Browse articles by category');
    var context = TT.el('p', 'tt-category-nav__context');
    context.appendChild(TT.el('strong', 'tt-category-nav__context-label', 'Categories'));
    context.appendChild(TT.el('span', null, 'Browse by category. A post\'s colour shows its main category; other tags, such as Documentation, have their own pages.'));
    nav.appendChild(context);
    var list = TT.el('ul');
    function item(label, url, active) {
      var li = TT.el('li');
      var a = TT.el('a', null, label);
      a.href = url;
      if (active) a.setAttribute('aria-current', 'page');
      li.appendChild(a);
      list.appendChild(li);
    }
    item('All', archiveHref, !!archiveList);
    var path = location.pathname;
    slugs.forEach(function (s) {
      var url = bySlug[s];
      if (!url) return;   /* no tag page for this category yet */
      var base = new URL(url).pathname.replace(/\/?$/, '/');
      var active = !!tagPage && (path === base || path === base.slice(0, -1) || path.indexOf(base + 'page/') === 0);
      item(TT.cats[s], url, active);
      if (active) tagPage.dataset.ttCategory = s;
    });
    nav.appendChild(list);
    if (tagPage) tagPage.querySelector('.page__header').insertAdjacentElement('afterend', nav);
    else archiveList.insertAdjacentElement('beforebegin', nav);
  });
})();
</script>
<!-- 9. CV index -->
<script>
/* CV index: replaces .tt-index (or a legacy #cv-toc) with a sticky two-level index from the headings.
   Master CV pages index H2/H3, older CV pages H3/H4. */
(function () {
  var TT = window.TT;
  if (!TT || !TT.toc) return;
  var marker = document.querySelector('.content__entry .tt-index') || document.getElementById('cv-toc');
  if (!marker) return;
  var root = marker.closest('.content__entry') || document.querySelector('.content__entry');
  /* label: the new snippet's text; else the old block's nav aria-label or its heading ("Index", "Índice"); else INDEX */
  var old = marker.classList.contains('tt-index') ? null : marker.querySelector('[aria-label], h4');
  var label = (old ? (old.getAttribute('aria-label') || old.textContent) : marker.textContent).trim() || 'INDEX';

  var index = TT.el('details', 'cv-toc');
  index.id = 'cv-toc';
  var summary = TT.el('summary');
  summary.setAttribute('aria-controls', 'cv-toc-nav');
  var nav = TT.el('nav', 'cv-toc__nav');
  nav.id = 'cv-toc-nav';
  nav.setAttribute('aria-label', label);
  index.appendChild(summary);
  index.appendChild(nav);
  marker.parentNode.replaceChild(index, marker);   /* first, so the old block's own heading is not indexed */

  var levels = root.querySelector('.cv-section > h2') ? ['H2', 'H3'] : ['H3', 'H4'];
  var toc = TT.toc(root, levels, '#cv-toc');
  if (!toc.count) { index.parentNode.removeChild(index); return; }
  summary.textContent = label + ' · ' + toc.count;
  nav.appendChild(toc.el);

  index.addEventListener('toggle', function () {
    if (!index.open) return;
    var a = toc.reveal();
    if (a && a.scrollIntoView) a.scrollIntoView({ block: 'nearest' });
  });
  var raf = 0;
  window.addEventListener('scroll', function () {
    if (!index.open || raf) return;
    raf = requestAnimationFrame(function () { raf = 0; toc.mark(); });
  }, { passive: true });
  document.addEventListener('click', function (event) {
    if (!index.open) return;
    var t = event.target;
    if (!index.contains(t) || (t.closest && t.closest('#cv-toc a'))) index.open = false;
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && index.open) { index.open = false; summary.focus(); }
  });
})();
</script>
